# nyx — dentro do server 443. Conteúdo movido sem mudança do antigo sites-available/nyx.

# API aceita JSON até 10mb + uploads (imports CSV etc.)
client_max_body_size 25m;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# /api direto no NestJS (sem passar pelo rewrite do Next)
location /api/ {
    proxy_pass http://nyx_api;
    proxy_set_header Connection "";
    # SSE (progresso dos solvers) + exports longos (OSO/PDF via soffice)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location / {
    proxy_pass http://nyx_web;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
